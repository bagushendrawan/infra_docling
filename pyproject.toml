[project]
name = "docling-extraction-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic-settings>=2.4", "python-multipart>=0.0.20", "docling-slim[convert-core,format-pdf,models-local]>=2.145,<3", "paddleocr>=3.0,<4", "paddlepaddle-gpu>=3.0,<4", "torch>=2.5", "torchvision", "boto3>=1.35", "openpyxl>=3.1", "httpx>=0.27", "pypdf>=5", "pillow>=11"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
[project.entry-points.docling]
paddle_direct = "src.extraction.ocr"
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle" }

[tool.ruff]
extend-exclude = [".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
cache-dir = "../.cache/uv"
link-mode = "hardlink"
